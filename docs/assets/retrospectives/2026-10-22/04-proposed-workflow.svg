<text x="1334" y="307.0" fill="#087F75" font-size="30" font-family="Arial Unicode MS, PingFang SC, sans-serif">06</text>
<text x="1334" y="357.9" fill="#14243D" font-size="31" font-family="Arial Unicode MS, PingFang SC, sans-serif">成片视听</text>
<text x="1334" y="411.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">检查实际最终</text>
<text x="1334" y="452.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">文件</text>
