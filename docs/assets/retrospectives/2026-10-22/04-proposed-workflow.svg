<rect x="1074" y="704" width="462" height="137" rx="18" fill="#FFF3DE"/>
<text x="1098" y="755.9" fill="#B46C17" font-size="31" font-family="Arial Unicode MS, PingFang SC, sans-serif">下一次制作复用</text>
<text x="1098" y="810.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">用真实场景再验证</text>
<text x="64" y="915.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">经验要进入下一次执行：原片对照解决内容问题，参考对照解决视觉问题，最终文件检查解决交付问题。</text>
