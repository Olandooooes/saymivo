<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img">
<title>建议的工作台制作主线</title>
<rect width="1600" height="100%" fill="white"/>
<text x="64" y="89.4" fill="#14243D" font-size="46" font-family="Arial Unicode MS, PingFang SC, sans-serif">建议的工作台制作主线</text>
<text x="64" y="144.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">产品改造方向  尚待落实与验收  当前成片制作继续暂停</text>
