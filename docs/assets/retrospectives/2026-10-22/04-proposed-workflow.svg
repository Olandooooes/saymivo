<text x="334" y="411.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">核对重录和上</text>
<text x="334" y="452.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">下文</text>
