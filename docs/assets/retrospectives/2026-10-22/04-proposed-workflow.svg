<rect x="569" y="704" width="462" height="137" rx="18" fill="#FFF3DE"/>
<text x="593" y="755.9" fill="#B46C17" font-size="31" font-family="Arial Unicode MS, PingFang SC, sans-serif">分类修复或保存</text>
<text x="593" y="810.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">软件缺陷与偏好分开</text>
<polyline points="1042,770 1064,770" fill="none" stroke="#B46C17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
