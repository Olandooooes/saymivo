<text x="64" y="607.0" fill="#14243D" font-size="30" font-family="Arial Unicode MS, PingFang SC, sans-serif">对应参考片段  ＋  实际动态预览  ＋  适用条件  ＋  差异与验收状态</text>
<polyline points="64,650 1536,650" fill="none" stroke="#D6DFEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
