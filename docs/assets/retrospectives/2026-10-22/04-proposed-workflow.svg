<text x="1084" y="411.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">沿认可方向展</text>
<text x="1084" y="452.2" fill="#52627A" font-size="28" font-family="Arial Unicode MS, PingFang SC, sans-serif">开</text>
<polyline points="1292,351 1307,351" fill="none" stroke="#087F75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
